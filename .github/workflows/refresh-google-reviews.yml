# Requests a build; success here does not verify the import or published site.
# Configure NETLIFY_BUILD_HOOK for the skydive.lu Netlify project. Missing or
# invalid configuration must fail visibly, rather than silently skip refreshes.
name: Refresh Google reviews

on:
  schedule:
    # Monday 06:17 UTC, away from the busiest start-of-hour scheduling period.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: google-reviews-refresh
  cancel-in-progress: false

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the refresh requester
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Request the production-branch rebuild
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: node scripts/request-google-reviews-refresh.mjs
